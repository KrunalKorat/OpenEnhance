[package]
name = "openenhance"
version = "0.1.0"
description = "Local-first AI video enhancement desktop application"
authors = ["OpenEnhance Contributors"]
license = ""
repository = "https://github.com/openenhance/openenhance"
edition = "2024"
rust-version = "1.90"

[lib]
name = "openenhance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt", "process"] }
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.17"
